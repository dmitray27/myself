name: radio_bridge_dual
description: Радиочат через UV-82 и ESP32 (TX + RX)

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  characters: ^1.3.0
  http: ^1.1.0
  web_socket_channel: ^3.0.3
  network_info_plus: ^5.0.3
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.2
  url_launcher: ^6.2.5
  window_manager: 0.4.3  # пиним совместимую версию для Flutter 3.22
  pointycastle: ^4.0.0
  path_provider: ^2.1.5
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true

  # Пути в AssetSource указываются относительно assets/ (префикс audioplayers)
  assets:
    - assets/73g_assets/sounds/notify.mp3
    - assets/info.json
    - assets/flash_info.json